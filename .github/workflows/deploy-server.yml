name: Deploy server to monday code

# Runs by itself whenever server code is merged to main, and can still be run by hand from the
# Actions tab with a different monday app version ID. Without one it deploys to the version below
# (v4, the live one); change SERVER_VERSION_ID under Settings, Variables, Actions to move it.
on:
  push:
    branches: [main]
    paths:
      - 'boost-sdr-os/server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:
    inputs:
      version_id:
        description: 'monday app version ID to deploy the server code to (leave empty for the usual one)'
        required: false

# One server deploy at a time, so two merges in a row cannot overlap.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Same CLI install approach as deploy.yml
      - name: Install Monday CLI
        run: |
          cd /tmp
          npm pack @mondaycom/apps-cli@4.9.2 2>/dev/null
          mkdir apps-cli-mod
          tar xzf mondaycom-apps-cli-4.9.2.tgz -C apps-cli-mod --strip-components=1
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('/tmp/apps-cli-mod/package.json'));
            pkg.scripts = {};
            fs.writeFileSync('/tmp/apps-cli-mod/package.json', JSON.stringify(pkg));
          "
          mv apps-cli-mod package
          tar czf mondaycom-apps-cli-modified.tgz package/
          mv package apps-cli-mod
          mkdir /tmp/cli
          cd /tmp/cli
          echo '{"name":"cli-tmp","version":"1.0.0"}' > package.json
          npm install --legacy-peer-deps /tmp/mondaycom-apps-cli-modified.tgz
          echo "/tmp/cli/node_modules/.bin" >> $GITHUB_PATH

      - name: Deploy server code
        working-directory: boost-sdr-os/server
        env:
          MAPPS_ACCESS_TOKEN: ${{ secrets.MAPPS_ACCESS_TOKEN }}
          VERSION_ID: ${{ inputs.version_id || vars.SERVER_VERSION_ID || '19622115' }}
        run: |
          echo "{\"accessToken\":\"$MAPPS_ACCESS_TOKEN\"}" > .mappsrc
          mapps code:push -i "$VERSION_ID"
